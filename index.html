<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Spinner</title>
<meta name="theme-color" content="#e4e5e8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1d1e22" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Spinner">
<meta name="application-name" content="Spinner">
<meta name="description" content="Spin the wheel to pick the order for a meeting or a game.">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
/* Layout: Home Board's look. Flat grey page, round grey buttons, solid pills, slide-up sheets.
   Follows the phone's light or dark setting. Wheel slices use Binder's section colours. */
:root{
  --bg:#e4e5e8; --ink:#2b2e33; --muted:#6b7079; --hair:#d0d2d6; --chip:#d5d7db; --field:#e3e4e7; --sheet:#eeeff1;
  --accent:#4f7bd4; --accent-2:#3f69bf; --on-accent:#fff; --alarm:#d0453b;
  --w0:#4f7bd4; --w1:#d45b6c; --w2:#8a6bb8; --w3:#c98a3e; --w4:#3f9a66;
  --i0:#fff; --i1:#fff; --i2:#fff; --i3:#2b2e33; --i4:#fff;
  --ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;
  color-scheme:light;
}
/* dark: follows the phone until you pick one with the sun / moon button */
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1d1e22; --ink:#e4e4e2; --muted:#8b9098; --hair:#34353b; --chip:#2f3035; --field:#2c2d32; --sheet:#25262b;
  --accent:#5f86d6; --accent-2:#7396de; --on-accent:#fff; --alarm:#e0645a;
  --w0:#5f86d6; --w1:#cf6475; --w2:#9679c2; --w3:#cf9550; --w4:#5cb683;
  --i0:#16171a; --i1:#16171a; --i2:#16171a; --i3:#16171a; --i4:#16171a;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#1d1e22; --ink:#e4e4e2; --muted:#8b9098; --hair:#34353b; --chip:#2f3035; --field:#2c2d32; --sheet:#25262b;
  --accent:#5f86d6; --accent-2:#7396de; --on-accent:#fff; --alarm:#e0645a;
  --w0:#5f86d6; --w1:#cf6475; --w2:#9679c2; --w3:#cf9550; --w4:#5cb683;
  --i0:#16171a; --i1:#16171a; --i2:#16171a; --i3:#16171a; --i4:#16171a;
  color-scheme:dark;
}
html{height:100%;overflow:hidden;overscroll-behavior:none;background:var(--bg)}
body{margin:0}
[hidden]{display:none!important}
*{box-sizing:border-box}
body{
  touch-action:manipulation;-webkit-text-size-adjust:100%;
  position:fixed;inset:0;overflow:hidden;overscroll-behavior:none;   /* the page itself never scrolls; only the menu does */
  color:var(--ink);background:var(--bg);font-family:var(--ui);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;
  padding:calc(14px + env(safe-area-inset-top,0px)) 16px calc(20px + env(safe-area-inset-bottom,0px));transition:background-color .35s,color .35s;
}
.wrap{max-width:540px;margin:0 auto}
button{font:inherit;cursor:pointer;color:inherit;background:none;border:0;padding:0}
button:disabled{opacity:.4;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header: title and count on the left, menu button on the right */
.desk{position:relative}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.top h1{margin:0;font-size:24px;font-weight:700;letter-spacing:-.4px;line-height:1.1}
.status{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-top:2px}
.hbtns{display:flex;gap:8px}
/* gray-scale wheel (menu → Wheel), light and dark */
:root[data-wheel="gray"]{--w0:#2b2e33;--w1:#8a9099;--w2:#50555c;--w3:#b9bec5;--w4:#6b7079;--i0:#fff;--i1:#16171a;--i2:#fff;--i3:#2b2e33;--i4:#fff}
@media (prefers-color-scheme:dark){:root[data-wheel="gray"]:not([data-theme="light"]){--w0:#e4e4e2;--w1:#5c6168;--w2:#b4b9c0;--w3:#3e4248;--w4:#8f949c;--i0:#16171a;--i1:#fff;--i2:#16171a;--i3:#fff;--i4:#16171a}}
:root[data-wheel="gray"][data-theme="dark"]{--w0:#e4e4e2;--w1:#5c6168;--w2:#b4b9c0;--w3:#3e4248;--w4:#8f949c;--i0:#16171a;--i1:#fff;--i2:#16171a;--i3:#fff;--i4:#16171a}
.wseg{display:inline-grid;grid-template-columns:1fr 1fr;gap:3px;padding:3px;border-radius:10px;background:var(--chip)}
.wseg button{border-radius:8px;padding:6px 12px;font-size:14px;font-weight:700;color:var(--muted)}
.wseg button[aria-pressed="true"]{background:var(--sheet);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.wrap{height:100%;display:flex;flex-direction:column}
.desk{flex:1;display:flex;flex-direction:column;min-height:0}
.main{flex:1;justify-content:center;min-height:0;padding-bottom:4vh}
.icon-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--chip);color:var(--ink);flex:none}
.icon-btn svg{width:19px;height:19px;stroke-width:2.2}

/* ---------- layout: phone first ---------- */
.main{display:flex;flex-direction:column;gap:16px}
.stage{display:flex;flex-direction:column;align-items:center;gap:14px}
.wheel-box{width:100%;max-width:max(280px,calc(100svh - 260px));aspect-ratio:424/436;position:relative}
#wheel{display:block;width:100%;height:100%;touch-action:none;cursor:grab;-webkit-user-select:none;user-select:none;overflow:visible}
#wheel.dragging{cursor:grabbing}
#rotor,#flap{transform-box:view-box}
.btns{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%;max-width:420px}
@media (min-width:860px) and (min-height:520px){ body{padding-block:22px} .wheel-box{max-width:calc(100vh - 230px)} }

/* ---------- wheel ---------- */
.rim{fill:var(--chip)} .face{fill:var(--sheet)} .hub{fill:var(--sheet)}
.spoke{stroke:var(--sheet);stroke-width:3}
.peg{fill:var(--sheet);opacity:.9}
.hubn{fill:var(--ink);font-family:var(--ui);font-weight:800;font-size:30px}
.hubl{fill:var(--muted);font-family:var(--ui);font-weight:800;font-size:11px;letter-spacing:.08em}
.pointer{fill:var(--ink);stroke:var(--bg);stroke-width:4;stroke-linejoin:round}
.wedge{transition:opacity .25s,filter .25s}
.wl{font-family:var(--ui);font-weight:700;pointer-events:none}
.dim .wedge:not(.win),.dim .wl:not(.win){opacity:.3}
.wedge.win{animation:flash .5s ease-in-out 3}
@keyframes flash{50%{filter:brightness(1.15)}}
.empty-hint{margin:2px 0 0;font-size:14px;font-weight:600;color:var(--muted);text-align:center}

/* ---------- pills ---------- */
.brass{width:100%;max-width:420px;min-height:54px;border-radius:27px;padding:0 22px;font-size:18px;font-weight:700;letter-spacing:-.2px;background:var(--accent);color:var(--on-accent)}
.brass:hover{background:var(--accent-2)}
.brass:active{transform:scale(.98)}
.brass:disabled{opacity:.6}
.leather{min-height:54px;border-radius:27px;padding:0 18px;font-size:17px;font-weight:700;background:var(--chip);color:var(--ink)}
.leather.green{min-height:34px;border-radius:17px;padding:0 14px;font-size:14px}
.link{height:34px;padding:0 14px;border-radius:17px;background:var(--chip);color:var(--ink);font-size:14px;font-weight:700;display:inline-flex;align-items:center}
.link.warn{background:var(--alarm);color:#fff}
.ord{flex:none;min-width:24px;height:24px;padding:0 7px;border-radius:12px;display:grid;place-items:center;font-size:12px;font-weight:800;color:var(--ink);background:var(--chip);font-variant-numeric:tabular-nums}

/* ---------- sheets slide up from the bottom ---------- */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.35);display:flex;align-items:flex-end;justify-content:center}
.scrim.scroll{overflow:hidden}
.pop,.card{position:relative;width:100%;max-width:500px;color:var(--ink);background:var(--sheet);border-radius:22px 22px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.18);
  padding:24px 16px calc(24px + env(safe-area-inset-bottom,0px));animation:sheetUp .28s cubic-bezier(.2,.9,.3,1)}
.pop::before,.card::before{content:"";position:absolute;top:8px;left:50%;width:36px;height:5px;margin-left:-18px;border-radius:3px;background:var(--hair)}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
.pop{max-height:calc(100% - 40px - env(safe-area-inset-top,0px));overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column;gap:14px}
.pop > *{flex-shrink:0}
.pop-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.pop-head .eyebrow{color:var(--muted)}
.pop-head h2{font-size:22px;font-weight:700;letter-spacing:-.3px;line-height:1.1;margin:2px 0 0}
.close{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--chip);color:var(--ink);flex:none}
.ppl{display:flex;flex-direction:column}
.prow{display:flex;align-items:center;gap:12px;border-bottom:.5px solid var(--hair);min-height:46px}
.chk{width:26px;height:26px;flex:none;border-radius:50%;border:2px solid var(--hair);display:grid;place-items:center;color:transparent}
.chk svg{width:15px;height:15px}
.chk.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.prow input{flex:1;min-width:0;font-weight:600;font-size:17px;color:var(--ink);background:transparent;border:0;padding:4px 2px}
.prow input:focus{outline:none;box-shadow:inset 0 -2px 0 var(--accent)}
.prow.out input{color:var(--muted)}
.rm{width:36px;height:36px;flex:none;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.rm:hover{color:var(--alarm)}
.empty-ppl{color:var(--muted);margin:0;font-size:15px;font-weight:600}
.add{display:flex;gap:8px;align-items:center}
.add input{flex:1;min-width:0;height:42px;font-size:16px;color:var(--ink);background:var(--field);border:0;border-radius:10px;padding:0 12px}
.add input:focus{outline:2px solid var(--accent)}
.add input::placeholder{color:var(--muted)}
.add-btn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--accent);color:var(--on-accent)}
.add-btn svg{width:20px;height:20px;stroke-width:2.6}
.preset{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hint{font-size:13px;font-weight:600;color:var(--muted);margin:0}
.set{display:flex;flex-direction:column;border-radius:12px;background:var(--field);overflow:hidden}
.cfg-row{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:48px;padding:0 12px 0 14px;font-size:16px;font-weight:600;color:var(--ink)}
.cfg-row + .cfg-row{border-top:.5px solid var(--hair)}
.switch{position:relative;display:inline-flex;align-items:center;cursor:pointer}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.switch .track{width:51px;height:31px;border-radius:16px;background:var(--chip);position:relative;transition:background .2s}
.switch .track::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:transform .2s}
.switch input:checked + .track{background:var(--accent)}
.switch input:checked + .track::after{transform:translateX(20px)}
.switch input:focus-visible + .track{outline:2px solid var(--accent);outline-offset:2px}
.stepper{display:inline-flex;align-items:center;gap:4px}
.stepper output{font-size:17px;font-weight:700;min-width:2.4ch;text-align:center;font-variant-numeric:tabular-nums}
.nudge{width:36px;height:36px;border-radius:50%;font-size:20px;font-weight:600;flex:none;background:var(--chip);color:var(--ink)}

/* ---------- whose turn ---------- */
.card{text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center;max-height:calc(100% - 24px);overflow:auto;padding-top:30px}
.eyebrow{font-size:12px;letter-spacing:.06em;color:var(--muted);font-weight:800;text-transform:uppercase}
.winner{font-weight:800;font-size:clamp(38px,11vw,48px);line-height:1.05;letter-spacing:-1px;overflow-wrap:anywhere;text-wrap:balance}
.flourish{display:none}
.clock-wrap{position:relative;width:176px;height:176px;margin:12px 0 4px}
.clock-wrap svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:var(--chip);stroke-width:9}
.ring-fg{fill:none;stroke:var(--accent);stroke-width:9;stroke-linecap:round;transition:stroke .3s}
.clock{position:absolute;inset:0;display:grid;place-items:center;font-weight:700;font-size:42px;letter-spacing:-1px;line-height:1;font-variant-numeric:tabular-nums}
.clock small{display:block;font-size:11px;font-weight:800;letter-spacing:.06em;color:var(--muted);margin-top:4px}
.over .ring-fg{stroke:var(--alarm)}
.over .clock{color:var(--alarm)}
.over .clock-wrap{animation:nudge .9s ease-in-out 2}
@keyframes nudge{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.t-btn{flex:0 0 auto;min-height:40px;border-radius:20px;padding:0 18px;font-size:15px}
.row-btns{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:10px;width:100%;margin-top:14px}
.row-btns .brass,.row-btns .leather{width:100%;max-width:none}
.kbd{font-size:12px;font-weight:600;color:var(--muted);margin:4px 0 0}
@media (hover:none){.kbd{display:none}}
@media (prefers-reduced-motion: reduce){.card,.pop,.wedge.win,.over .clock-wrap{animation:none}}
html,body{touch-action:manipulation}   /* no double-tap zoom */
</style>
<script>try{var t=localStorage.getItem('spinner-theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t;if(localStorage.getItem('spinner-wheel')==='gray')document.documentElement.dataset.wheel='gray'}catch(e){}</script>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="desk">
    <div class="top">
      <div><h1>Spinner</h1><span class="status" id="status"></span></div>
      <span class="hbtns"><button class="icon-btn round" id="themeBtn" aria-label="Switch to dark mode"></button><button class="icon-btn round" id="cfg" aria-label="Open menu" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button></span>
    </div>
    <div class="main" id="main">
      <div class="stage">
        <div class="wheel-box">
          <svg id="wheel" viewBox="-212 -224 424 436" role="img" aria-label="Spinner wheel">
            <circle class="rim" r="206"/>
            <circle class="face" r="190"/>
            <g id="rotor"></g>
            <g id="hub" pointer-events="none">
              <circle class="hub" r="44"/>
              <text class="hubn" id="hubN" y="7" text-anchor="middle"></text>
              <text class="hubl" id="hubL" y="25" text-anchor="middle">TO GO</text>
            </g>
            <g id="flap"><path class="pointer" d="M0 -168 C-5 -181 -15 -196 -15 -207 A15 15 0 0 1 15 -207 C15 -196 5 -181 0 -168 Z"/></g>
          </svg>
        </div>
        <div class="btns">
          <button class="brass" id="spinBtn">Spin</button>
          <p class="empty-hint" id="emptyHint" hidden>Open the menu <span aria-hidden="true">&#9776;</span> to add names</p>
        </div>
      </div>
    </div>
  </div>
</div>
<div id="layer"></div>

<script>
(() => {
'use strict';
const KEY = 'spinner-v1';
const INFRA = ['Jordan', 'Doug', 'Brodie', 'Joe', 'James', 'Steve', 'Prince', 'DJ', 'Noore', 'Noah', 'Martyn', 'Ben'];
// Wedge finishes: RPM blue, ivory, banker's green, stained walnut, each with its own lettering
const COLORS = [0, 1, 2, 3, 4].map(i => ({ fill: `var(--w${i})`, ink: `var(--i${i})` }));   // blue, rose, purple, amber, green
const R_WEDGE = 188, R_HUB = 44, R_PEG = 193, L_IN = R_HUB + 12, L_OUT = R_WEDGE - 14;
const NS = 'http://www.w3.org/2000/svg';
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const mod = (a, n) => ((a % n) + n) % n;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

const X = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>';
const MENU = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>';
const TRASH = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 7h14M10 11v6M14 11v6M7 7l1 12a1.5 1.5 0 0 0 1.5 1.4h5A1.5 1.5 0 0 0 16 19l1-12M9.5 7V4.5h5V7"/></svg>';
const PLUS = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>';
const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const FLOURISH = '<svg class="flourish" viewBox="0 0 150 14" aria-hidden="true"><path d="M2 7h52M96 7h52" stroke="currentColor" stroke-width="1"/><path d="M75 1l6 6-6 6-6-6z" fill="currentColor"/><circle cx="60" cy="7" r="2" fill="currentColor"/><circle cx="90" cy="7" r="2" fill="currentColor"/></svg>';
const NOFILL = 'autocomplete="off" autocorrect="off" spellcheck="false" data-1p-ignore data-lpignore="true" data-bwignore data-form-type="other"';

/* ---------- saved state ---------- */
function load() {
  const base = { people: [], done: [], nextId: 1, timer: { on: false, mins: 3 }, sound: true };
  try {
    const d = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (d && Array.isArray(d.people)) {
      const s = Object.assign(base, d, { timer: Object.assign(base.timer, d.timer || {}) });
      s.done = (s.done || []).filter(x => x && x.id != null);
      return s;
    }
  } catch (e) {}
  return base;
}
let S = load();
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

const onWheel = () => S.people.filter(p => p.in);
const isDone = id => S.done.some(d => d.id === id);
const live = () => onWheel().filter(p => !isDone(p.id));

/* ---------- sound ---------- */
let ac = null;
function audio() {
  if (!S.sound) return null;
  if (!ac) { const C = window.AudioContext || window.webkitAudioContext; if (!C) return null; ac = new C(); }
  if (ac.state === 'suspended') ac.resume();
  return ac;
}
function tone(freq, dur, vol, type, delay = 0) {
  const c = audio(); if (!c) return;
  const t = c.currentTime + delay, o = c.createOscillator(), g = c.createGain();
  o.type = type || 'triangle'; o.frequency.value = freq;
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.004);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(c.destination); o.start(t); o.stop(t + dur + 0.02);
}
const tick = () => tone(1100 + Math.random() * 250, 0.025, 0.06, 'square');
const ding = () => { tone(659, 0.18, 0.12); tone(988, 0.4, 0.11, 'triangle', 0.12); };
const chime = () => { tone(784, 0.3, 0.12); tone(659, 0.3, 0.12, 'triangle', 0.22); tone(523, 0.5, 0.12, 'triangle', 0.44); };

/* ---------- wheel drawing ---------- */
let rot = 0;            // wheel rotation in degrees (clockwise)
let wedges = [];        // [{p, ci, node, label}] in drawing order
let pegStep = 15;
const polar = (r, deg) => { const a = deg * Math.PI / 180; return [r * Math.cos(a), r * Math.sin(a)]; };
function el(tag, attrs, parent) {
  const n = document.createElementNS(NS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(n);
  return n;
}


// Each person keeps the finish of their seat on the full wheel; neighbours that match after people leave get nudged
function colorsFor(ppl, all) {
  const out = ppl.map(p => Math.max(0, all.indexOf(p)) % COLORS.length);
  const n = out.length;
  for (let i = 1; i < n; i++) {
    const after = i === n - 1 && n > 2 ? out[0] : -1;
    if (out[i] === out[i - 1] || out[i] === after) {
      for (let c = 0; c < COLORS.length; c++) if (c !== out[i - 1] && c !== after && c !== out[(i + 1) % n]) { out[i] = c; break; }
    }
  }
  return out;
}

function renderWheel() {
  const rotor = $('#rotor');
  rotor.textContent = '';
  $('#wheel').classList.remove('dim');
  const all = onWheel();
  const ppl = live().length ? live() : all;
  const cols = colorsFor(ppl, all);
  wedges = ppl.map((p, i) => ({ p, ci: cols[i] }));

  const n = wedges.length;
  const step = 360 / Math.max(n, 8);
  if (!n) {                                         // empty board: the slices without names
    for (let i = 0; i < 8; i++) slice(rotor, -90 + i * step - step / 2, step, COLORS[i % COLORS.length].fill, 8);
    for (let i = 0; i < 8; i++) spoke(rotor, -90 + i * step - step / 2);
    pegStep = step / 2; drawPegs(rotor);
    setRot(rot);
    return;
  }
  const st = 360 / n;
  wedges.forEach((w, i) => {
    w.node = slice(rotor, -90 + i * st, st, COLORS[w.ci].fill, n);
    w.node.setAttribute('class', 'wedge');
  });
  if (n > 1) wedges.forEach((w, i) => spoke(rotor, -90 + i * st));
  wedges.forEach((w, i) => { w.label = label(rotor, w.p.name, -90 + (i + 0.5) * st, n, COLORS[w.ci].ink); });
  pegStep = st / Math.max(1, Math.ceil(18 / n));
  drawPegs(rotor);
  setRot(rot);
}
function slice(rotor, a0, step, fill, n) {
  if (n === 1) return el('circle', { r: R_WEDGE, style: `fill:${fill}` }, rotor);
  const s0 = polar(R_WEDGE, a0), e = polar(R_WEDGE, a0 + step);
  return el('path', { style: `fill:${fill}`, d: `M0 0L${s0[0].toFixed(2)} ${s0[1].toFixed(2)}A${R_WEDGE} ${R_WEDGE} 0 ${step > 180 ? 1 : 0} 1 ${e[0].toFixed(2)} ${e[1].toFixed(2)}Z` }, rotor);
}
function spoke(rotor, a) {
  const e = polar(R_WEDGE, a);
  el('line', { x1: 0, y1: 0, x2: e[0].toFixed(2), y2: e[1].toFixed(2), class: 'spoke' }, rotor);
}
function drawPegs(rotor) {
  for (let a = 0; a < 359.9; a += pegStep) {
    const p = polar(R_PEG, -90 + a);
    el('circle', { cx: p[0].toFixed(2), cy: p[1].toFixed(2), r: 3, class: 'peg' }, rotor);
  }
}
// Names run along the wedge from hub to rim, flipped to stay upright for where the wheel is resting
function label(parent, name, mid, n, ink) {
  const avail = L_OUT - L_IN;
  const lmid = (L_IN + L_OUT) / 2;
  const chord = n === 1 ? 999 : 2 * lmid * Math.sin(Math.PI / n);
  let size = clamp(Math.min(28, chord * 0.55, avail / (0.6 * Math.max(name.length, 3))), 9, 30);
  const world = mod(mid + rot, 360);
  const flip = world > 90 && world < 270;
  const t = el('text', {
    class: 'wl', 'dominant-baseline': 'central', 'font-size': size.toFixed(1), style: `fill:${ink}`,
    x: flip ? -L_OUT : L_OUT, y: 0, 'text-anchor': flip ? 'start' : 'end',
    transform: `rotate(${(flip ? mid + 180 : mid).toFixed(3)})`
  }, parent);
  t.textContent = name;
  let w = 0; try { w = t.getComputedTextLength(); } catch (e) {}
  if (w > avail) {
    size = Math.max(9, Math.floor(size * avail / w * 10) / 10);
    t.setAttribute('font-size', size.toFixed(1));
    let s = name; try { w = t.getComputedTextLength(); } catch (e) { w = 0; }
    while (w > avail + 1 && s.length > 2) { s = s.slice(0, -1).trimEnd(); t.textContent = s + '…'; w = t.getComputedTextLength(); }
  }
  return t;
}

/* ---------- motion: wheel, pegs and the brass pointer ---------- */
let lastDir = 1, lastPeg = null;
const flap = { a: 0, v: 0, target: 0 };
let flapRaf = 0, flapT = 0;

function setRot(r) {
  if (r !== rot) lastDir = r > rot ? 1 : -1;
  rot = r;
  $('#rotor').setAttribute('transform', `rotate(${rot.toFixed(2)})`);
  const peg = Math.floor(-rot / pegStep);
  if (lastPeg !== null && peg !== lastPeg) tick();
  lastPeg = peg;
  const gap = mod(-rot, pegStep), zone = Math.min(pegStep * 0.45, 7);
  const g = lastDir > 0 ? gap : pegStep - gap;
  const push = g < zone ? 1 - g / zone : 0;
  flap.target = -lastDir * 26 * push;
  kickFlap();
}
function kickFlap() { if (!flapRaf) { flapT = performance.now(); flapRaf = requestAnimationFrame(flapLoop); } }
function flapLoop(now) {
  let dt = Math.min(40, now - flapT); flapT = now;
  while (dt > 0) {          // little spring, stepped in 4ms slices
    const h = Math.min(4, dt); dt -= h;
    flap.v += (-0.0012 * flap.a - 0.03 * flap.v) * h;
    flap.a += flap.v * h;
    const s = Math.sign(flap.target);
    if (s && s * flap.a < s * flap.target) { flap.a = flap.target; flap.v = 0; }   // the peg holds it
  }
  $('#flap').setAttribute('transform', `rotate(${flap.a.toFixed(2)} 0 -206)`);
  if (spinning || drag || Math.abs(flap.a - flap.target) > 0.05 || Math.abs(flap.v) > 0.001) flapRaf = requestAnimationFrame(flapLoop);
  else flapRaf = 0;
}

let spinning = false;
const easeOut = t => 1 - Math.pow(1 - t, 4);

function spin(opts = {}) {
  if (spinning || ui.card) return;
  if (!onWheel().length) { openSettings(); return; }
  if (!live().length) { S.done = []; save(); renderWheel(); }
  audio();
  if (live().length === 1) { ding(); reveal(live()[0]); return; }
  const list = live();

  let pool = list;
  if (opts.exclude != null) { const w = list.filter(p => p.id !== opts.exclude); if (w.length) pool = w; }
  const winner = pool[Math.floor(Math.random() * pool.length)];
  const mine = wedges.map((w, i) => w.p.id === winner.id ? i : -1).filter(i => i >= 0);
  const idx = mine[Math.floor(Math.random() * mine.length)], n = wedges.length, step = 360 / n;
  const dir = opts.dir || 1, v = opts.v || 0;
  const f = 0.15 + Math.random() * 0.7;                 // land inside the wedge, never on a line
  const want = mod(-(idx + f) * step, 360), cur = mod(rot, 360);
  const delta = dir > 0 ? mod(want - cur, 360) : -mod(cur - want, 360);
  const turns = reduced ? 1 : v ? clamp(Math.round(v * 5), 3, 9) : 4 + Math.floor(Math.random() * 2);
  const D = dir * turns * 360 + delta;
  const T = reduced ? 900 : v ? clamp(4 * Math.abs(D) / v, 3600, 8500) : 5400 + Math.random() * 900;
  const from = rot, t0 = performance.now();

  spinning = true; paint();
  const frame = now => {
    const p = Math.min(1, (now - t0) / T);
    setRot(from + D * easeOut(p));
    if (p < 1) requestAnimationFrame(frame);
    else {
      ding();                                       // stay locked until the card is up
      $('#wheel').classList.add('dim');
      mine.forEach(i => { wedges[i].node.classList.add('win'); wedges[i].label.classList.add('win'); });
      setTimeout(() => { spinning = false; paint(); reveal(winner); }, reduced ? 100 : 650);
    }
  };
  requestAnimationFrame(frame);
}

/* drag or flick the wheel; a plain tap spins it */
let drag = null;
function angleAt(e) {
  const r = $('#wheel').getBoundingClientRect();
  const cy = r.top + r.height * (224 / 436);
  return Math.atan2(e.clientY - cy, e.clientX - (r.left + r.width / 2)) * 180 / Math.PI;
}
$('#wheel').addEventListener('pointerdown', e => {
  if (spinning || ui.card || e.button > 0) return;
  drag = { id: e.pointerId, last: angleAt(e), total: 0, r0: rot, samples: [{ t: performance.now(), r: rot }] };
  $('#wheel').setPointerCapture(e.pointerId);
  $('#wheel').classList.add('dragging');
});
$('#wheel').addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id || !onWheel().length) return;
  const a = angleAt(e);
  let d = a - drag.last; if (d > 180) d -= 360; if (d < -180) d += 360;
  drag.last = a; drag.total += d;
  setRot(drag.r0 + drag.total);
  const now = performance.now();
  drag.samples.push({ t: now, r: rot });
  while (drag.samples.length > 2 && now - drag.samples[0].t > 100) drag.samples.shift();
});
function endDrag(e) {
  if (!drag || e.pointerId !== drag.id) return;
  const d = drag; drag = null;
  $('#wheel').classList.remove('dragging');
  const a = d.samples[0], b = d.samples[d.samples.length - 1];
  const v = b.t > a.t && performance.now() - b.t < 120 ? (b.r - a.r) / (b.t - a.t) : 0;
  if (Math.abs(v) > 0.25) spin({ dir: Math.sign(v), v: Math.abs(v) });
  else if (Math.abs(d.total) < 4 && e.type === 'pointerup') spin();
  else if (Math.abs(d.total) >= 4) renderWheel();     // re-level the names after a hand turn
}
$('#wheel').addEventListener('pointerup', endDrag);
$('#wheel').addEventListener('pointercancel', endDrag);

/* ---------- whose turn ---------- */
const ui = { card: null, pop: null, confirmNew: 0, confirmClear: 0 };
const timer = { total: 0, left: 0, running: false, last: 0, chimed: false, iv: 0 };

function reveal(person) {
  const left = live().length;
  ui.card = { id: person.id, name: person.name, last: left === 1, more: left > 1 };
  timer.total = timer.left = S.timer.mins * 60000;
  timer.running = false; timer.chimed = false;
  drawCard();
}
function fmt(ms) { const s = Math.max(0, Math.round(ms / 1000)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }

function drawCard() {
  const c = ui.card;
  const C = 2 * Math.PI * 76;
  const more = c.more;
  $('#layer').innerHTML = `<div class="scrim"><div class="card" role="dialog" aria-modal="true" aria-label="${esc(c.name)} is up">
    <div class="eyebrow">${c.last ? 'Last but not least' : 'You’re up'}</div>
    <div class="winner">${esc(c.name)}</div>
    ${FLOURISH}
    ${S.timer.on ? `<div class="clock-wrap"><svg viewBox="0 0 170 170" aria-hidden="true"><circle class="ring-bg" cx="85" cy="85" r="76"/><circle class="ring-fg" id="ring" cx="85" cy="85" r="76" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="0"/></svg>
      <div class="clock"><div><span id="clock">${fmt(timer.left)}</span><small id="cstate">READY</small></div></div></div>
      <button class="leather t-btn" id="tBtn">Start timer</button>` : ''}
    <div class="row-btns">
      ${more ? '<button class="leather" id="again">Spin again</button>' : ''}
      <button class="brass" id="next">${more ? 'Next' : 'Done'}</button>
    </div>
    <p class="kbd">Enter for next${S.timer.on ? ' · Space for the timer' : ''}</p>
  </div></div>`;
  $('#next').onclick = next;
  if ($('#again')) $('#again').onclick = again;
  if ($('#tBtn')) $('#tBtn').onclick = toggleTimer;
  $('#next').focus();
  paintClock();
}
function closeCard() {
  clearInterval(timer.iv); timer.running = false;
  ui.card = null; $('#layer').innerHTML = '';
}
function next() {
  const c = ui.card; if (!c) return;
  if (!isDone(c.id)) S.done.push({ id: c.id });
  const left = live();
  if (!left.length) S.done = [];                 // round finished: everyone back on for next time
  save(); closeCard();
  if (left.length === 1) { paint(); ding(); reveal(left[0]); return; }   // no spin for the last one
  renderWheel(); paint();
}
function again() {
  const id = ui.card && ui.card.id;
  closeCard(); renderWheel(); paint();
  spin({ exclude: id });
}
function toggleTimer() {
  if (timer.running) { timer.running = false; clearInterval(timer.iv); }
  else {
    audio();
    timer.running = true; timer.last = performance.now();
    if (timer.left === timer.total) tone(880, 0.12, 0.08);
    clearInterval(timer.iv);
    timer.iv = setInterval(() => {
      const now = performance.now();
      timer.left -= now - timer.last; timer.last = now;
      if (timer.left <= 0 && !timer.chimed) { timer.chimed = true; chime(); }
      paintClock();
    }, 200);
  }
  paintClock();
}
function paintClock() {
  if (!S.timer.on || !$('#clock')) return;
  const over = timer.left < 0;
  $('.card').classList.toggle('over', over);
  $('#clock').textContent = over ? '+' + fmt(-timer.left) : fmt(timer.left);
  $('#cstate').textContent = over ? 'OVER TIME' : timer.running ? 'LEFT' : timer.left === timer.total ? 'READY' : 'PAUSED';
  const C = 2 * Math.PI * 76;
  $('#ring').setAttribute('stroke-dashoffset', over ? 0 : (C * (1 - timer.left / timer.total)).toFixed(1));
  $('#tBtn').textContent = timer.running ? 'Pause' : timer.left === timer.total ? 'Start timer' : 'Resume';
}

/* ---------- main screen ---------- */
function paint() {
  const has = onWheel().length > 0;
  const btn = $('#spinBtn');
  btn.hidden = !has;
  btn.disabled = spinning;
  btn.textContent = spinning ? 'Spinning…' : 'Spin';
  $('#emptyHint').hidden = has;
  const togo = live().length, gone = onWheel().filter(p => isDone(p.id)).length;
  $('#status').textContent = !has ? 'Add names to start' : gone ? `${togo} to go · ${gone} gone` : `${onWheel().length} on the wheel`;
  $('#hubN').textContent = has ? (togo || onWheel().length) : '';
  $('#hubL').textContent = has ? (gone ? 'TO GO' : 'ON') : '';
}
function loadInfra() {           // replaces whoever is on the list with the Infra team
  S.people = INFRA.map(n => ({ id: S.nextId++, name: n, in: true }));
  S.done = [];
  save();
}
function bringBack() { S.done = []; save(); renderWheel(); paint(); }
$('#spinBtn').onclick = () => spin();

/* ---------- settings ---------- */
function openSettings() { if (spinning || ui.card) return; ui.pop = true; $('#cfg').setAttribute('aria-expanded', 'true'); drawSettings(); }
function closeSettings() { ui.pop = null; $('#cfg').setAttribute('aria-expanded', 'false'); $('#layer').innerHTML = ''; renderWheel(); paint(); }
function drawSettings(focusAdd) {
  const rows = S.people.map(p => `<div class="prow${p.in ? '' : ' out'}" data-id="${p.id}">
      <button class="chk${p.in ? ' on' : ''}" data-act="in" aria-pressed="${p.in}" aria-label="${p.in ? 'On the wheel' : 'Sitting out'}: ${esc(p.name)}">${CHECK}</button>
      <input value="${esc(p.name)}" aria-label="Name" maxlength="24" name="sp-${p.id}" ${NOFILL}>
      ${isDone(p.id) ? `<span class="ord" title="Went ${S.done.findIndex(d => d.id === p.id) + 1}">${S.done.findIndex(d => d.id === p.id) + 1}</span>` : ''}
      <button class="rm" data-act="rm" aria-label="Remove ${esc(p.name)}">${TRASH}</button></div>`).join('');
  const t = S.timer;
  $('#layer').innerHTML = `<div class="scrim scroll" id="scrim"><div class="pop" role="dialog" aria-modal="true" aria-label="Menu">
    <div class="pop-head"><div><div class="eyebrow">Menu</div><h2>On the wheel</h2></div><button class="icon-btn round" id="xSet" aria-label="Close menu">${X}</button></div>
    <div class="set">
      <div class="cfg-row"><span>Timer</span><label class="switch"><input type="checkbox" id="tOn" ${t.on ? 'checked' : ''}><span class="track"></span></label></div>
      ${t.on ? `<div class="cfg-row"><span>Minutes each</span><span class="stepper"><button class="nudge" id="mDown" aria-label="Less time">−</button><output id="mins">${t.mins}</output><button class="nudge" id="mUp" aria-label="More time">+</button></span></div>` : ''}
      <div class="cfg-row"><span>Wheel</span><span class="wseg" role="group" aria-label="Wheel colours"><button type="button" data-wheel="" aria-pressed="${!wheelGray()}">Colour</button><button type="button" data-wheel="gray" aria-pressed="${wheelGray()}">Gray</button></span></div>
      <div class="cfg-row"><span>Sound</span><label class="switch"><input type="checkbox" id="sOn" ${S.sound ? 'checked' : ''}><span class="track"></span></label></div>
    </div>
    <div class="ppl" id="ppl">${rows || '<p class="empty-ppl">No one yet. Add names below, or load the Infra team.</p>'}</div>
    <div class="add"><input id="newName" placeholder="Add a name" maxlength="60" name="sp-new" ${NOFILL} enterkeyhint="done"><button class="add-btn" id="addP" aria-label="Add">${PLUS}</button></div>
    <div class="preset">
      <button class="leather green" id="infra">Load Infra team</button>
      ${S.people.length ? `<button class="link${ui.confirmClear ? ' warn' : ''}" id="clearAll">${ui.confirmClear ? 'Tap again to clear' : 'Clear all'}</button>` : ''}
    </div>
    ${S.people.length ? '<p class="hint">Uncheck someone to sit them out. Numbers show the order people have gone this round.</p>' : ''}
    ${S.done.length ? `<div class="preset"><button class="link" id="setNew">Bring everyone back</button><span class="hint">${S.done.length} gone so far</span></div>` : ''}
  </div></div>`;
  $('#xSet').onclick = closeSettings;
  $('#scrim').addEventListener('click', e => { if (e.target.id === 'scrim') closeSettings(); });
  $('#ppl').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    const id = +b.closest('.prow').dataset.id, p = S.people.find(x => x.id === id);
    if (b.dataset.act === 'in') p.in = !p.in;
    if (b.dataset.act === 'rm') S.people = S.people.filter(x => x.id !== id);
    save(); drawSettings(); renderWheel(); paint();
  });
  $('#ppl').addEventListener('input', e => {
    const id = +e.target.closest('.prow').dataset.id, p = S.people.find(x => x.id === id);
    const v = e.target.value.trim(); if (!v) return;
    p.name = v; S.done.forEach(d => { if (d.id === id) d.name = v; });
    save(); renderWheel(); paint();
  });
  const add = () => {
    const names = $('#newName').value.split(',').map(s => s.trim()).filter(Boolean);
    if (!names.length) return;
    names.forEach(n => S.people.push({ id: S.nextId++, name: n.slice(0, 24), in: true }));
    save(); drawSettings(true); renderWheel(); paint();
  };
  $('#addP').onclick = add;
  $('#newName').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); add(); } });
  if ($('#setNew')) $('#setNew').onclick = () => { bringBack(); drawSettings(); };
  $('#infra').onclick = () => { loadInfra(); drawSettings(); renderWheel(); paint(); };
  if ($('#clearAll')) $('#clearAll').onclick = () => {
    if (!ui.confirmClear) { ui.confirmClear = setTimeout(() => { ui.confirmClear = 0; if (ui.pop) drawSettings(); }, 3000); drawSettings(); return; }
    clearTimeout(ui.confirmClear); ui.confirmClear = 0;
    S.people = []; S.done = []; save(); drawSettings(); renderWheel(); paint();
  };
  $('#tOn').onchange = e => { S.timer.on = e.target.checked; save(); drawSettings(); };
  $('#sOn').onchange = e => { S.sound = e.target.checked; save(); if (S.sound) tick(); };
  document.querySelectorAll('.wseg button').forEach(b => b.onclick = () => { setWheel(b.dataset.wheel); drawSettings(); renderWheel(); });
  if ($('#mUp')) {
    const step = d => { const m = S.timer.mins; S.timer.mins = clamp(m + d * (m + d * 0.5 <= 2 ? 0.5 : 1), 0.5, 30); save(); $('#mins').textContent = S.timer.mins; };
    $('#mUp').onclick = () => step(1); $('#mDown').onclick = () => step(-1);
  }
  if (focusAdd) $('#newName').focus();
}
$('#cfg').onclick = openSettings;

/* ---------- keyboard (laptop) ---------- */
document.addEventListener('keydown', e => {
  if (/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)) { if (e.key === 'Escape' && ui.pop) closeSettings(); return; }
  if (ui.pop) { if (e.key === 'Escape') closeSettings(); return; }
  if (ui.card) {
    if (e.key === 'Enter') { e.preventDefault(); next(); }
    else if (e.code === 'Space' && S.timer.on) { e.preventDefault(); toggleTimer(); }
    return;
  }
  if ((e.code === 'Space' || e.key === 'Enter') && !/BUTTON/.test(document.activeElement.tagName)) { e.preventDefault(); spin(); }
});

/* ---------- wheel colours: colour or gray scale (saved on this phone) ---------- */
function wheelGray(){ return document.documentElement.dataset.wheel === 'gray' }
function setWheel(v){
  if(v === 'gray') document.documentElement.dataset.wheel = 'gray'; else delete document.documentElement.dataset.wheel;
  try{ localStorage.setItem('spinner-wheel', v || '') }catch(e){}
}

/* ---------- light / dark ---------- */
const MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 14.6A8.5 8.5 0 0 1 9.4 3.5a8.5 8.5 0 1 0 11.1 11.1z"/></svg>';
const SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4L6 18M18 6l1.4-1.4"/></svg>';
const sysDark = matchMedia('(prefers-color-scheme: dark)');
function isDark(){ const t = document.documentElement.dataset.theme; return t ? t === 'dark' : sysDark.matches }
function paintTheme(){
  const dark = isDark();
  $('#themeBtn').innerHTML = dark ? SUN : MOON;
  $('#themeBtn').setAttribute('aria-label', dark ? 'Switch to light mode' : 'Switch to dark mode');
  document.querySelectorAll('meta[name="theme-color"]').forEach(m => { m.content = dark ? '#1d1e22' : '#e4e5e8'; m.removeAttribute('media') });
}
(function(){ let t = null; try{ t = localStorage.getItem('spinner-theme') }catch(e){} if(t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; })();
$('#themeBtn').onclick = () => {
  const next = isDark() ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  try{ localStorage.setItem('spinner-theme', next) }catch(e){}
  paintTheme();
};
try{ sysDark.addEventListener('change', paintTheme) }catch(e){}
paintTheme();

/* ---------- start ---------- */
rot = -360 / Math.max(2, onWheel().length) / 2;     // first wedge centred under the pointer
renderWheel(); paint();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (!spinning) renderWheel(); });
})();
document.addEventListener('gesturestart', e => e.preventDefault(), { passive: false });   // no pinch zoom, like Home Board
document.addEventListener('gesturechange', e => e.preventDefault(), { passive: false });
</script>
</body>
</html>
